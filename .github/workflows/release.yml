name: Build and Publish Tagged Release

on:
  push:
    tags:
      - 'v*' # Triggers on any tag push starting with 'v' (e.g., v1.0.0, v0.1.2)
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (Required for manual runs, e.g. v1.0.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Release
    runs-on: ubuntu-latest

    # Security check: Allows all Git tag pushes OR manual dispatch by the repo owner
    if: >-
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) ||
      (github.event_name == 'workflow_dispatch' && github.actor == github.repository_owner)

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Build Release Binary
        run: cargo build --release --locked

      - name: Prepare Release Artifacts
        run: |
          mkdir -p dist
          tar -czf dist/gutenberg_parser-linux-amd64.tar.gz -C target/release gutenberg_parser

      - name: Determine Tag Name
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag_name }}"
          else
            # For tag pushes, github.ref_name automatically holds the tag string (e.g., 'v1.0.0')
            TAG="${{ github.ref_name }}"
          fi
          echo "tag_name=${TAG}" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag_name }}
          name: Release ${{ steps.tag.outputs.tag_name }}
          body: |
            Automated Release for `${{ steps.tag.outputs.tag_name }}`.
            - **Commit:** `${{ github.sha }}`
          draft: false
          prerelease: false
          files: |
            dist/gutenberg_parser-linux-amd64.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}