[package]
name = "gutenberg_parser"
version = "0.1.0"
edition = "2021"

[dependencies]
bzip2 = "0.4"
tar = "0.4"
roxmltree = "0.20"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
flate2 = "1.0"
crossbeam-channel = "0.5"
rayon = "1.10"
regex = "1.10"
clap = { version = "4.4", features = ["derive"] }
num_cpus = "1.17.0"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
