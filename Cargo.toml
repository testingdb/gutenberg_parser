[package]
name = "gutenberg_parser"
version = "1.2.0"
edition = "2021"
license = "MIT"

[dependencies]
bzip2 = "0.4"
tar = "0.4"
roxmltree = "0.20"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
flate2 = "1.0"
crossbeam-channel = "0.5"
regex = "1.10"
clap = { version = "4.4", features = ["derive"] }
ureq = "3"
tempfile = "3"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
